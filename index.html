<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strayed From Will - Inicio </title>
    <meta name="description" content="Strayed From Will banda espanola de Metalcore.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="images/StrayedFWTextlogo.png" alt="Strayed From Will Logo" class="logo" width="100" height="100">

        <nav>
            <a href="">Inicio</a>
            <a href="">Conciertos</a>
            <a href="">Integrantes</a>
            <a href="">Tienda</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="carousel-container">
                <div class="carousel-slide active fade">
                    <img src="images/Integrantes22.jpg" alt="Imagen 1 de los Integrantes de la banda Strayed From Will">
                </div>
                <div class="carousel-slide fade">
                    <img src="images/Integrantes1.jpg" alt="Imagen 2 de los Integrantes de la banda Strayed From Will">
                </div>
                <div class="carousel-slide fade">I
                    <img src="images/Integrantes3.jpg" alt="Imagen 3 de los Integrantes de la banda Strayed From Will">
                </div>
                <div class="carousel-slide fade">
                    <img src="images/Integrantes4.jpg" alt="Imagen 4 de los Integrantes de la banda Strayed From Will">
                </div>
            </div>
            <img src="images/StrayedFWTextlogo.png">
        </section>

        <article>
            <video muted loop disablePictureInPicture src="images/Galaxy.mp4" autoplay></video>

            <div class="contenido-album">
                <img class="portada-album" src="images/FutureHumanitySFW.jpg" alt="Imagen del album de Future Humanity de Strayed From Will">

                <div class="album-info">
                <h2 class="titulo-album">Future Humanity <br>Ya disponible!</h2>
                <ol class="lista-canciones">
                    <li>01 - Threshold </li>
                    <li>02 - Hybrids </li>
                    <li>03 - Strayed from Will </li>
                    <li>04 - Black Abbys </li>
                </ol>
                </div>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>

</html>
